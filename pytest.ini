[pytest]
# Both suites in one invocation. `importlib` is what makes that possible: the
# two directories contain same-named modules (test_risk_radar.py exists in
# each), and the default prepend import mode aborts collection with 23
# duplicate-basename errors. Without this the two had to be run separately,
# which is how 277 tests went unrun while a 158-test partial suite reported
# success.
testpaths = tests Serp-compete/tests
addopts = --import-mode=importlib
